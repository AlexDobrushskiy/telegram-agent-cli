version: 2

project_name: telegram-agent-cli

before:
  hooks:
    - go mod download

builds:
  - id: telegram-agent-cli
    main: ./cmd/telegram-agent-cli
    binary: telegram-agent-cli
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # same -X targets as the Makefile
    ldflags:
      - -s -w
      - -X github.com/AlexDobrushskiy/telegram-agent-cli/internal/cli.Version={{ .Version }}
      - -X github.com/AlexDobrushskiy/telegram-agent-cli/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/AlexDobrushskiy/telegram-agent-cli/internal/cli.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - skills/**/*
      - docs/*.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  draft: false

homebrew_casks:
  - name: telegram-agent-cli
    binaries: [telegram-agent-cli]
    homepage: https://github.com/AlexDobrushskiy/telegram-agent-cli
    description: Telegram user-account CLI for AI agents, read-only by default
    license: MIT
    commit_author:
      name: telegram-agent-cli release
      email: noreply@github.com
    commit_msg_template: "telegram-agent-cli {{ .Tag }}"
    # The binaries are not notarized; clear the download quarantine so macOS runs them.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/telegram-agent-cli"]
          end
    repository:
      owner: AlexDobrushskiy
      name: homebrew-tap
      git:
        url: git@github.com:AlexDobrushskiy/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
